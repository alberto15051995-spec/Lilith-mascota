name: Compilar Lilith Companion APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LILITH_KEYSTORE_BASE64: ${{ secrets.LILITH_KEYSTORE_BASE64 }}
      LILITH_STORE_PASSWORD: ${{ secrets.LILITH_STORE_PASSWORD }}
      LILITH_KEY_ALIAS: ${{ secrets.LILITH_KEY_ALIAS }}
      LILITH_KEY_PASSWORD: ${{ secrets.LILITH_KEY_PASSWORD }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar firma estable (solo si hay secretos)
        if: ${{ env.LILITH_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lilith-signing"
          printf '%s' "$LILITH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lilith-signing/release.jks"
          echo "LILITH_KEYSTORE_PATH=$RUNNER_TEMP/lilith-signing/release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK firmada y actualizable
        if: ${{ env.LILITH_KEYSTORE_BASE64 != '' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publicar APK firmada
        if: ${{ env.LILITH_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LilithCompanion-stable-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compilar APK de prueba sin firma estable
        if: ${{ env.LILITH_KEYSTORE_BASE64 == '' }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK de prueba
        if: ${{ env.LILITH_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LilithCompanion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
