plugins { id 'com.android.application' }

android {
    namespace 'com.lilith.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lilith.companion'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5'
    }
    signingConfigs {
        lilithStable {
            def keyFile = System.getenv('LILITH_KEYSTORE_PATH')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('LILITH_STORE_PASSWORD')
                keyAlias System.getenv('LILITH_KEY_ALIAS')
                keyPassword System.getenv('LILITH_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('LILITH_KEYSTORE_PATH')) {
                signingConfig signingConfigs.lilithStable
            }
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
